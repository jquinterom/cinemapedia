name: cinemapedia
description: "A new Flutter project."
publish_to: "none"
version: 0.1.4+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.2.4
  flutter_dotenv: ^6.0.0
  dio: ^5.9.0
  flutter_riverpod: ^3.0.3
  card_swiper: ^3.0.1
  animate_do: ^4.2.0
  intl: ^0.20.2
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  flutter_staggered_grid_view: ^0.7.0
  flutter_native_splash: ^2.4.7
  purchases_flutter: ^9.10.1
  purchases_ui_flutter: ^9.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.7.1
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app-icon-2.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/

flutter_native_splash:
  color: "#252829"